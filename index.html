<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Downloader</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e293b;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 480px;
        }
        h1 { font-size: 1.5rem; margin-bottom: 1rem; text-align: center; }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #334155;
            border-radius: 6px;
            background: #0f172a;
            color: white;
            box-sizing: border-box;
            margin-bottom: 1rem;
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #3b82f6;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #2563eb; }
        button:disabled { background: #64748b; cursor: not-allowed; }
        #status { 
            margin-top: 1rem; 
            font-size: 0.9rem; 
            text-align: center; 
            color: #94a3b8; 
            word-break: break-word;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>Video Downloader</h1>
    <input type="text" id="videoUrl" placeholder="Paste YouTube Video URL..." />
    <button id="downloadBtn" onclick="startDownload()">Download Video</button>
    <div id="status"></div>
</div>

<script>
    // Extract YouTube Video ID from various link formats
    function extractYouTubeId(url) {
        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
        const match = url.match(regExp);
        return (match && match[2].length === 11) ? match[2] : null;
    }

    async function startDownload() {
        const urlInput = document.getElementById('videoUrl').value.trim();
        const status = document.getElementById('status');
        const btn = document.getElementById('downloadBtn');

        if (!urlInput) {
            status.innerText = 'Please enter a URL';
            status.style.color = '#ef4444';
            return;
        }

        const videoId = extractYouTubeId(urlInput);
        if (!videoId) {
            status.innerText = 'Invalid YouTube URL provided.';
            status.style.color = '#ef4444';
            return;
        }

        btn.disabled = true;
        status.innerText = 'Extracting download streams...';
        status.style.color = '#94a3b8';

        // Public CORS-friendly Piped API instances
        const pipedInstances = [
            'https://pipedapi.kavin.rocks',
            'https://api.piped.privacydev.net',
            'https://pipedapi.mha.fi'
        ];

        let downloadUrl = null;

        for (const instance of pipedInstances) {
            try {
                status.innerText = `Connecting to API instance...`;
                const response = await fetch(`${instance}/streams/${videoId}`);
                
                if (!response.ok) continue;

                const data = await response.json();

                // Find stream with both audio and video or highest combined quality
                if (data.videoStreams && data.videoStreams.length > 0) {
                    const progressiveStreams = data.videoStreams.filter(s => s.hasVideo && s.hasAudio);
                    
                    if (progressiveStreams.length > 0) {
                        downloadUrl = progressiveStreams[0].url;
                    } else {
                        downloadUrl = data.videoStreams[0].url;
                    }
                    
                    if (downloadUrl) break;
                }
            } catch (e) {
                console.warn(`Instance ${instance} failed, trying fallback...`);
            }
        }

        if (downloadUrl) {
            status.innerText = 'Download starting...';
            status.style.color = '#22c55e';
            window.location.href = downloadUrl;
        } else {
            status.innerText = 'Error: Public API endpoints blocked or unreachable. Serverless backends are recommended for GitHub Pages.';
            status.style.color = '#ef4444';
        }

        btn.disabled = false;
    }
</script>

</body>
</html>
