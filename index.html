<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Video Downloader</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e293b;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 480px;
        }
        h1 { 
            font-size: 1.5rem; 
            margin-bottom: 1rem; 
            text-align: center; 
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #334155;
            border-radius: 6px;
            background: #0f172a;
            color: white;
            box-sizing: border-box;
            margin-bottom: 1rem;
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #3b82f6;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #2563eb;
        }
        button:disabled { 
            background: #64748b; 
            cursor: not-allowed; 
        }
        #status { 
            margin-top: 1rem; 
            font-size: 0.9rem; 
            text-align: center; 
            color: #94a3b8; 
            word-break: break-word;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>Local Video Downloader</h1>
    <input type="text" id="videoUrl" placeholder="Paste YouTube, Twitter, or TikTok URL..." />
    <button id="downloadBtn" onclick="startDownload()">Download Video</button>
    <div id="status"></div>
</div>

<script>
    async function startDownload() {
        const urlInput = document.getElementById('videoUrl').value.trim();
        const status = document.getElementById('status');
        const btn = document.getElementById('downloadBtn');

        if (!urlInput) {
            status.innerText = 'Please enter a URL';
            status.style.color = '#ef4444';
            return;
        }

        btn.disabled = true;
        status.innerText = 'Fetching download link...';
        status.style.color = '#94a3b8';

        try {
            // Send request to Cobalt public API
            const response = await fetch('https://api.cobalt.tools/api/json', {
                method: 'POST',
                headers: {
                    'Accept': 'application/json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    url: urlInput,
                    videoQuality: '720'
                })
            });

            const data = await response.json();

            if (data.status === 'stream' || data.status === 'redirect') {
                status.innerText = 'Download starting...';
                status.style.color = '#22c55e';
                
                // Redirect browser to trigger direct download
                window.location.href = data.url;
            } else if (data.status === 'picker') {
                status.innerText = 'Multiple items found. Opening first link...';
                status.style.color = '#22c55e';
                window.location.href = data.picker[0].url;
            } else {
                throw new Error(data.text || 'Unable to process video URL.');
            }
        } catch (err) {
            console.error(err);
            status.innerText = 'Error: ' + err.message;
            status.style.color = '#ef4444';
        } finally {
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
