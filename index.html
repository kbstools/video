<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Downloader</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: #1e293b;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 520px;
        }
        h1 { font-size: 1.5rem; margin-top: 0; margin-bottom: 1.5rem; text-align: center; }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #334155;
            border-radius: 6px;
            background: #0f172a;
            color: white;
            font-size: 14px;
            outline: none;
            margin-bottom: 1rem;
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #3b82f6;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }
        iframe {
            width: 100%;
            height: 180px;
            border: none;
            border-radius: 8px;
            margin-top: 1rem;
            display: none;
            background: #0f172a;
        }
        #status { margin-top: 1rem; font-size: 0.9rem; text-align: center; color: #94a3b8; }
    </style>
</head>
<body>

<div class="card">
    <h1>Video Downloader</h1>
    <input type="text" id="videoUrl" placeholder="Paste YouTube Video URL..." />
    <button onclick="generateDownload()">Get Download Links</button>
    <div id="status"></div>
    <iframe id="downloadFrame"></iframe>
</div>

<script>
    function generateDownload() {
        const urlInput = document.getElementById('videoUrl').value.trim();
        const status = document.getElementById('status');
        const frame = document.getElementById('downloadFrame');

        const videoIdMatch = urlInput.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?.*v=|embed\/|v\/))([\w-]{11})/);

        if (!videoIdMatch || !videoIdMatch[1]) {
            status.innerText = 'Please enter a valid YouTube URL.';
            status.style.color = '#ef4444';
            frame.style.display = 'none';
            return;
        }

        const videoId = videoIdMatch[1];
        status.innerText = 'Loading download widget...';
        status.style.color = '#22c55e';

        // Load third-party extraction widget frame
        frame.src = `https://loader.to/api/card/?url=https://www.youtube.com/watch?v=${videoId}`;
        frame.style.display = 'block';
    }
</script>

</body>
</html>
